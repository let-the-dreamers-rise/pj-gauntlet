plugins {
    id 'application'
}

repositories {
    // Google's Maven Central mirror: same artifacts, no rate limiting
    maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
    mavenCentral()
}

sourceSets {
    main {
        // Sparrow's payjoin sources, copied unmodified (see vendor/SPARROW_COMMIT)
        java.srcDirs = ['src/main/java', 'vendor']
    }
}

dependencies {
    implementation files('libs/drongo.jar', 'libs/tern-1.0.6.jar')
    // drongo runtime (drongo/build.gradle)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'
    implementation('org.pgpainless:pgpainless-core:1.7.7') { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-common' }
    implementation 'de.mkammerer:argon2-jvm:2.12'
    implementation 'dnsjava:dnsjava:3.6.4'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'
    implementation 'net.java.dev.jna:jna:5.18.1'
    implementation 'ch.qos.logback:logback-classic:1.5.32'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    // tern 1.0.6 runtime (its pom)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.eclipse.jetty:jetty-client:9.4.54.v20240208'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.15'
    implementation 'org.apache.commons:commons-lang3:3.7'
    // used directly by Payjoin.java (versions from sparrow/build.gradle; javafx.concurrent only, 25 as 26 is not on Maven Central)
    implementation 'com.google.guava:guava:33.5.0-jre'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation files('libs/javafx-base-25-linux.jar', 'libs/javafx-graphics-25-linux.jar')
}

application {
    mainClass = 'pjg.SparrowAdapter'
}
